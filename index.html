<style>:root{--bg:#f3f0fc;--card:#fff;--fg:#1b1633;--mut:#6d688a;--bd:#e6e1f4;--ac:#6d4aff;--ok:#12b76a;--bad:#f04438;--m:#4f6bff;--p:#12b76a;--o:#f79009;--c:#ee46bc;--t:#06aed4;--sh:0 10px 30px -14px rgba(80,50,200,.35);

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 104px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
main{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,.sh,.ring b,.dt b,details.rm summary{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
.hero{color:#fff;border-radius:30px;padding:20px 18px 18px;background:radial-gradient(120% 90% at 0% 0%,#7c3aed 0,transparent 55%),radial-gradient(90% 80% at 100% 0%,#ec4899 0,transparent 55%),radial-gradient(90% 90% at 80% 110%,#06b6d4 0,transparent 55%),#1d1560;box-shadow:var(--sh)}
.ht{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hero h1{font-size:26px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.hero p{margin:4px 0 0;font-size:13px;opacity:.85}
.ib{display:flex;gap:6px}
.ib button{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.hm{display:flex;gap:18px;align-items:center;margin-top:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800}
.bars{flex:1;display:grid;gap:10px}
.bars .bl{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.bars .bl span{opacity:.8;font-weight:500}
.bt{height:6px;border-radius:4px;background:rgba(255,255,255,.22);margin-top:4px;overflow:hidden}
.bt i{display:block;height:100%;background:linear-gradient(90deg,#fff,#ffd1f4);border-radius:4px}
.nx{margin-top:16px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.14);font-size:13px;display:grid;gap:2px}
.nx span{opacity:.8}
#bk{display:none;margin-top:12px}
#bk textarea{width:100%;height:96px;font:12px/1.4 monospace;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
#bk .ib{margin-top:8px;align-items:center}#bm{font-size:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:0 2px 10px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{font-size:11px;font-weight:700;color:var(--mut);text-align:center;margin-bottom:6px}
.cd{aspect-ratio:1/1.1;border-radius:16px;background:var(--card);border:1.5px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:16px}
.cd .mo{font-style:normal;font-size:9px;color:var(--mut);height:10px;line-height:10px;font-weight:600}
.cd.aw{background:linear-gradient(160deg,color-mix(in srgb,var(--bad) 24%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--bad) 45%,var(--bd))}
.cd.ca{background:linear-gradient(160deg,color-mix(in srgb,var(--o) 26%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--o) 50%,var(--bd))}
.cd.fl{border-color:var(--ok)}
.cd.tdy{box-shadow:0 0 0 2.5px var(--ac)}
.cd.sel{background:linear-gradient(145deg,#6d4aff,#c13cff);border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px #8b3dff}.cd.sel .mo{color:rgba(255,255,255,.85)}
.dots{display:flex;gap:3px;height:6px}
.dots u{width:6px;height:6px;border-radius:50%;display:block}
.d1{background:var(--bad)}.d2{background:var(--o)}.d3{background:var(--ok)}
.cd.sel .d3{background:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dh h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.dh span{font-size:13px;color:var(--mut);font-weight:700}
.ph{font-size:13px;color:var(--mut);margin:2px 0 8px}
.tgs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tg2{font-style:normal;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px}
.tg2.r{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.tg2.a{background:color-mix(in srgb,var(--o) 18%,var(--card));color:var(--o)}
.tg2.g{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.tip{font-size:13px;padding:9px 12px;border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 14%,var(--card)),color-mix(in srgb,var(--c) 12%,var(--card)));margin-bottom:4px}
.row{display:flex;gap:11px;align-items:flex-start;padding:12px;margin-top:9px;border-radius:18px;background:color-mix(in srgb,var(--a) 11%,var(--card));border:1px solid color-mix(in srgb,var(--a) 28%,var(--card));cursor:pointer}
.row input,.tg input{position:absolute;opacity:0;pointer-events:none}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--a);margin-top:2px;display:flex;align-items:center;justify-content:center}
input:checked+.ck{background:var(--a)}
input:checked+.ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rb em{display:flex;gap:8px;align-items:baseline;font-style:normal;font-size:13px;font-weight:800;color:var(--a);margin-bottom:1px}
.rb em s{text-decoration:none;color:var(--mut);font-weight:500;font-size:12px}
.rb span{font-size:14px}
.row:has(input:checked) .rb span{opacity:.5}
.nv{display:flex;justify-content:space-between;margin-top:12px}
.nv button{font-size:13px;font-weight:800;color:var(--ac);padding:8px 4px}
details.rm{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:2px 16px;margin-top:14px}
details.rm summary{cursor:pointer;font-size:18px;font-weight:800;padding:13px 0}
.ps{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.ps b{flex:none;width:92px;color:var(--ac);font-size:13px}
.pl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}.pl::-webkit-scrollbar{display:none}
.pl button{flex:none;font-size:13px;font-weight:700;padding:8px 15px;border-radius:99px;background:var(--card);border:1.5px solid var(--bd)}
.pl button.on{background:linear-gradient(135deg,#6d4aff,#c13cff);border-color:transparent;color:#fff}
.tc{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:13px;margin-bottom:11px}
.dt{flex:none;width:54px;text-align:center;border-radius:16px;padding:7px 0;background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.dt b{display:block;font-size:23px;font-weight:800;line-height:1.1}.dt span{font-size:11px;color:var(--mut);font-weight:700}
.tb{flex:1;min-width:0}
.tm{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800}
.gs{padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac)}
.st{margin-left:auto}.done .st{color:var(--ok)}.over .st{color:var(--bad)}.pend .st{color:var(--mut)}
.tc.done .dt{background:color-mix(in srgb,var(--ok) 20%,var(--card))}.tc.over .dt{background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.tt{font-size:14px;margin:4px 0 6px}.pn{font-size:12.5px;color:var(--o);font-weight:700;margin-bottom:6px}
.tgl{display:flex;gap:6px;flex-wrap:wrap}
.tg{position:relative}
.tg span{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--bd);color:var(--mut)}
.tg input:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
details.nt{margin-top:8px}
details.nt summary{font-size:12.5px;color:var(--mut);cursor:pointer;font-weight:700}
.nt input{width:100%;margin-top:6px;font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{position:relative;text-align:left;color:#fff;border-radius:22px;padding:12px 13px 13px;min-height:100px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;flex-direction:column;gap:1px;box-shadow:0 10px 22px -12px var(--g1);opacity:.78}
.tile.on{opacity:1;outline:3px solid var(--fg);outline-offset:2px}
.tile .em{font-size:26px;line-height:1.1}.tile b{font:800 16px "Bricolage Grotesque","DM Sans",sans-serif}.tile small{font-size:12px;opacity:.9}
.pb2{display:block;height:5px;border-radius:4px;background:rgba(255,255,255,.3);margin-top:auto;overflow:hidden}.pb2 u{display:block;height:100%;background:#fff}
.gp{border-radius:22px;padding:14px 16px;margin-bottom:10px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.gp h3{margin:0;font-size:21px;font-weight:800}.gp small{display:block;opacity:.9;margin-top:2px;font-size:12.5px}
.sh{font-size:17px;font-weight:800;margin:18px 2px 8px;color:var(--ac)}
.tp{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin-bottom:9px;overflow:hidden}
.tp summary{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;list-style:none}
.tp summary::-webkit-details-marker{display:none}
.nb{flex:none;width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.tt2{flex:1;font-weight:700;font-size:14px;line-height:1.3}.tt2 small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}
.ct2{flex:none;font-size:12px;font-weight:800;color:var(--mut)}
.tp[open] summary{border-bottom:1px solid var(--bd)}
.tp.dn{border-color:var(--ok)}.tp.dn .ct2{color:var(--ok)}
.mc{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.mc .tg span{font-weight:600;font-size:12.5px}
.ac2{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px}
.ac2 button{font-size:12.5px;font-weight:800;color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:24px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}

</style>
